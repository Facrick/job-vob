[project]
name = "qa-smart-assistant"
version = "0.1.0"
description = "QA Smart Assistant Pro — поиск вакансий, ИИ-письма, mock-интервью, учебник QA"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Запуск из корня; core/* импортируется без установки пакета
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--reruns 2 --reruns-delay 1 --alluredir=allure-results" 

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "build", "dist", "data", "logs", "covers"]

[tool.ruff.lint]
# Базовый набор: ошибки, флейк, импорты, баги
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # длину строк не контролируем жёстко
    "E741",  # однобуквенные имена (l, e) допустимы в коротких лямбдах/циклах
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
