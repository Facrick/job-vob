name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        # Тесты ядра используют только stdlib, ruff анализирует статически —
        # тяжёлые зависимости (flet/groq/playwright) для CI не нужны.
        run: python -m pip install --upgrade pip ruff pytest

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest (core)
        run: pytest
